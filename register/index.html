<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your shop · ShelfWise</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head><body class="auth-page auth-register"><main class="auth-panel"><a class="auth-brand" href="/"><span class="auth-mark">S</span>ShelfWise</a><h1>Set up your shop.</h1><p>Create your account and shop workspace. You can explore the demo first if you prefer.</p><form id="registerForm"><label for="owner">Owner name</label><input id="owner" required autocomplete="name" placeholder="Your name"><label for="shopName">Shop name</label><input id="shopName" required placeholder="e.g. Sharma General Store"><label for="identifier">Email or phone</label><input id="identifier" required autocomplete="username" placeholder="you@example.com"><label for="category">Shop category</label><select id="category"><option>Grocery</option><option>Convenience store</option><option>Produce</option><option>Pharmacy</option><option>Other</option></select><label for="address">Shop address</label><input id="address" autocomplete="street-address" placeholder="Address (optional)"><label for="password">Password</label><input id="password" required type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><div id="error" class="auth-error" role="alert"></div><button type="submit">Create shop workspace</button></form><a class="auth-button alt" href="/app?demo=1">Explore demo shop →</a><div class="auth-note">Your password is hashed on the server, and shop records are stored in the shared database. Use HTTPS before using real shop records.</div><div class="auth-links">Already registered? <a href="/login">Sign in</a></div></main><script src="/auth.js"></script><script src="/auth-pages.js"></script></body></html>
